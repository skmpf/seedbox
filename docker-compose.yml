x-environment: &default-environment
  PUID: ${PUID}
  TZ: ${TZ}

x-common: &common
  restart: unless-stopped

services:
  calibre:
    <<: *common
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre
    environment:
      <<: [*default-environment]
      HARDCOVER_TOKEN: "eyJhbGciOiJIUzI1NiJ9..-yrhv5x3ZJqFS6nVDYxH7N7Y-5Ijiih69F87LYjP6DU"
      NETWORK_SHARE_MODE: true
    volumes:
      - ${DOCKERCONFDIR}/calibre:/config
      - ${DOCKERSTORAGEDIR}/media/ebooks/ingest:/cwa-book-ingest
      - ${DOCKERSTORAGEDIR}/media/ebooks/library:/calibre-library
      - ${DOCKERCONFDIR}/calibre/plugins:/config/.config/calibre/plugins
    ports:
      - 8083:8083

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: [*default-environment]
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
    ports:
      - "${PORT:-8191}:8191"
    volumes:
      - ${DOCKERCONFDIR}/flaresolverr:/config

  gluetun:
    <<: *common
    image: qmcgaw/gluetun
    container_name: gluetun
    # line above must be uncommented to allow external containers to connect.
    # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/connect-a-container-to-gluetun.md#external-container-to-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: bridge
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      # other ports
      - 8080:8080 # qbitorrent
      - 6881:6881 # qbitorrent
      - 6881:6881/udp # qbitorrent
    volumes:
      - ${DOCKERCONFDIR}/gluetun:/gluetun
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      <<: [*default-environment]
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      # OpenVPN:
      # OPENVPN_USER:
      # OPENVPN_PASSWORD:
      # Wireguard:
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      SERVER_REGIONS: France
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      # UPDATER_PERIOD:

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: [*default-environment]
      JELLYFIN_PublishedServerUrl: http://192.168.0.5 #optional
    volumes:
      - ${DOCKERCONFDIR}/jellyfin/library:/config
      - ${DOCKERSTORAGEDIR}/media/tv:/data/tvshows
      - ${DOCKERSTORAGEDIR}/media/movies:/data/movies
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    # optional for hardware acceleration, check your GPU and drivers compatibility with the image documentation
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "937" # check yours: SSH in and run `cat /etc/group | grep videodriver`

  navidrome:
    <<: *common
    image: deluan/navidrome:latest
    container_name: navidrome
    user: ${PUID}:${PGID} # should be owner of volumes
    ports:
      - "4533:4533"
    environment:
      <<: [*default-environment]
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
    volumes:
      - ${DOCKERCONFDIR}/navidrome:/data
      - ${DOCKERSTORAGEDIR}/media/music:/music:ro

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: [*default-environment]
    volumes:
      - ${DOCKERCONFDIR}/prowlarr/data:/config
    ports:
      - 9696:9696

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: [*default-environment]
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
      DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${DOCKERCONFDIR}/qbittorrent:/config
      - ${DOCKERSTORAGEDIR}:/shared
    depends_on:
      - gluetun
    network_mode: "service:gluetun"

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/shared
    ports:
      - 7878:7878
    environment:
      <<: [*default-environment]

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      LOG_LEVEL: debug
      TZ: ${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${DOCKERCONFDIR}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/shared
    ports:
      - 8989:8989
    environment:
      <<: [*default-environment]
